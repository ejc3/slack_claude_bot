version: '3.8'

services:
  slack-claude-bot:
    build: .
    container_name: slack-claude-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Mount a workspace directory if using CLI mode
      - ./workspace:/workspace
    # Uncomment for health checks
    # healthcheck:
    #   test: ["CMD", "node", "-e", "process.exit(0)"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
